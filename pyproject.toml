[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-velocity"
version = "1.0.0"
authors = [
  { name="Aditya Raj Singh Chouhan", email="adityarajschouhan@gmail.com" },
]
description = "llm_velocity is a high-performance Python wrapper designed to optimize repeated Large Language Model (LLM) calls."
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "faiss-cpu>=1.13.2",
    "numpy>=2.4.4",
    "rapidfuzz>=3.14.5",
    "requests>=2.33.1",
    "sentence-transformers>=5.4.1",
]

[project.urls]
"Homepage" = "https://github.com/ChouhanAdityaRaj/llm_velocity"
"Bug Tracker" = "https://github.com/ChouhanAdityaRaj/llm_velocity/issues"
