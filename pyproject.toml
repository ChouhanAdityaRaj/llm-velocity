[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-velocity"
version = "2.0.0"
authors = [
  { name="Aditya Raj Singh Chouhan", email="adityarajschouhan@gmail.com" },
]
description = "llm_velocity` is a lightweight agent orchestration framework designed to build high-performance, cost-effective AI agents. It drastically reduces llm call expenses and accelerates response times by intelligently optimizing how the language model is utilized."
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "faiss-cpu==1.13.2",
    "numpy==2.4.4",
    "platformdirs==4.11.2",
    "rapidfuzz==3.14.5",
    "requests==2.33.1",
    "sentence-transformers==5.4.1",
]

[project.urls]
"Homepage" = "https://github.com/ChouhanAdityaRaj/llm_velocity"
"Bug Tracker" = "https://github.com/ChouhanAdityaRaj/llm_velocity/issues"
